name: conflicts

# Labels open PRs that conflict with main and tells the author, re-checked
# whenever main moves. pull_request_target gives a token that can label fork
# PRs; it never checks out PR code, so nothing from the fork runs here.
on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  issues: write

concurrency:
  group: conflicts
  cancel-in-progress: false

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # v3.1.0, pinned by commit since this job holds a write token.
      - uses: eps1lon/actions-label-merge-conflict@0273be72a0bbd58fcd71d0d6c02c209b50d1e5e1
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          dirtyLabel: needs rebase
          retryAfter: 30
          retryMax: 10
          commentOnDirty: >-
            This PR now conflicts with `main`. Please rebase (or merge `main` in)
            and push; CI and this label update on their own. If `capabilities.json`
            conflicts, take `main`'s version and run `npm run manifest` rather than
            resolving it by hand.
          commentOnClean: Conflicts resolved, thanks.
